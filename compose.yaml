services:
  channels:
    image: ghcr.io/lancej1011/stremio-channels:latest
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 7654
      DATA_DIR: /data
      CHANNELS_FILE: /config/channels.json
      # Docker publishes this container port on host loopback only (below). The explicit
      # acknowledgement prevents the in-container 0.0.0.0 bind from failing closed.
      ALLOW_UNAUTHENTICATED_NON_LOOPBACK: "true"
    # Loopback-only, and it should stay that way. The channel editor is never published,
    # and a tunnel that makes the addon reachable from outside runs on the host and
    # connects here — so there is no case where this needs a wider binding.
    ports:
      - "127.0.0.1:7654:7654"
    volumes:
      - ./config:/config
      - ./data:/data
