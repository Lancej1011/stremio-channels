name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Full ffmpeg/HLS integration suite
        run: npm run test:integration

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: stremio-channels:ci
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test container health
        run: |
          mkdir -p "$RUNNER_TEMP/channels-config" "$RUNNER_TEMP/channels-data"
          cp channels.example.json "$RUNNER_TEMP/channels-config/channels.json"
          docker run -d --name stremio-channels-ci \
            -p 127.0.0.1:7654:7654 \
            -v "$RUNNER_TEMP/channels-config:/config" \
            -v "$RUNNER_TEMP/channels-data:/data" \
            stremio-channels:ci
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:7654/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs stremio-channels-ci
          exit 1
      - name: Container logs
        if: always()
        run: docker logs stremio-channels-ci 2>&1 || true
      - name: Remove smoke-test container
        if: always()
        run: docker rm -f stremio-channels-ci 2>/dev/null || true
