name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run licenses:check
      - run: npm run workflows:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Full ffmpeg/HLS integration suite
        run: npm run test:integration

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: stremio-channels:ci
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test container health
        run: |
          mkdir -p "$RUNNER_TEMP/channels-config" "$RUNNER_TEMP/channels-data"
          cp channels.example.json "$RUNNER_TEMP/channels-config/channels.json"
          docker run -d --name stremio-channels-ci \
            -p 127.0.0.1:7654:7654 \
            -v "$RUNNER_TEMP/channels-config:/config" \
            -v "$RUNNER_TEMP/channels-data:/data" \
            stremio-channels:ci
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:7654/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs stremio-channels-ci
          exit 1
      - name: Container logs
        if: always()
        run: docker logs stremio-channels-ci 2>&1 || true
      - name: Remove smoke-test container
        if: always()
        run: docker rm -f stremio-channels-ci 2>/dev/null || true
